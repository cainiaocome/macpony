[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hammerspoon-macapi"
version = "0.1.0"
description = "Typed async Python SDK for the Hammerspoon Mac Control API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "ruff>=0.8",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hammerspoon_macapi = ["py.typed"]

[tool.pyright]
include = ["src", "../tests/python"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "hammerspoon: requires a running Hammerspoon instance on macOS",
]
