name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tools
        run: python -m pip install -e 'python-client[dev]'
      - name: Ruff
        run: |
          ruff check python-client/src tests
          ruff format --check python-client/src tests
      - name: Pyright
        run: pyright
      - name: Unit tests
        run: pytest tests/python
      - name: Build package
        run: python -m build python-client

  lua:
    name: Lua and Hammerspoon checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua syntax checker
        run: brew install lua
      - name: Lua syntax checks
        run: make lua-check
      - name: Install Python test dependencies
        run: python -m pip install -e 'python-client[dev]'
      - name: SDK tests on macOS
        run: pytest tests/python

  hammerspoon:
    name: Hammerspoon macOS end-to-end
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hammerspoon and Python SDK
        run: |
          brew install --cask hammerspoon
          python -m pip install -e 'python-client[dev]'
      - name: Install Hammerspoon configuration
        run: |
          mkdir -p "$HOME/.hammerspoon"
          cp tests/integration/hammerspoon_init.lua "$HOME/.hammerspoon/init.lua"
          cp -R hammerspoon/macapi "$HOME/.hammerspoon/macapi"
      - name: Launch Hammerspoon
        run: |
          unset MACAPI_ENABLE_DANGEROUS_ACTIONS
          nohup /Applications/Hammerspoon.app/Contents/MacOS/Hammerspoon \
            >/tmp/hammerspoon-open.log 2>&1 </dev/null &
          echo "HAMMERSPOON_PID=$!" >> "$GITHUB_ENV"
          socket_path="$HOME/Library/Application Support/HammerspoonMacAPI/run/macapi.sock"
          for attempt in $(seq 1 30); do
            if [ -S "$socket_path" ]; then exit 0; fi
            sleep 1
          done
          echo "Hammerspoon did not create $socket_path" >&2
          cat /tmp/hammerspoon-open.log 2>/dev/null || true
          find "$HOME/Library/Logs" -maxdepth 3 -type f -iname '*hammerspoon*' -print -exec tail -100 {} \; 2>/dev/null || true
          exit 1
      - name: Start independent Hammerspoon RSS sampler
        run: |
          sampler_path="$RUNNER_TEMP/hammerspoon-rss.tsv"
          (
            echo -e "timestamp\trss_kib"
            while kill -0 "$HAMMERSPOON_PID" 2>/dev/null; do
              rss=$(ps -o rss= -p "$HAMMERSPOON_PID" | tr -d ' ')
              if [ -n "$rss" ]; then
                printf '%s\t%s\n' "$(date +%s)" "$rss"
              fi
              sleep 1
            done
          ) > "$sampler_path" 2>&1 &
          echo "HAMMERSPOON_SAMPLER_PID=$!" >> "$GITHUB_ENV"
      - name: Real Hammerspoon end-to-end test suite
        env:
          RUN_HAMMERSPOON_INTEGRATION: '1'
          HAMMERSPOON_MEMORY_ITERATIONS: '120'
          HAMMERSPOON_MEMORY_REPORT: ${{ runner.temp }}/hammerspoon-memory.json
        run: pytest -vv tests/integration -m hammerspoon
      - name: Collect Hammerspoon memory diagnostics
        if: failure()
        run: |
          ps -o pid,ppid,rss,vsz,etime,command -p "$HAMMERSPOON_PID" || true
          vmmap -summary "$HAMMERSPOON_PID" > "$RUNNER_TEMP/hammerspoon-vmmap-summary.txt" 2>&1 || true
          sample "$HAMMERSPOON_PID" 5 1 -file "$RUNNER_TEMP/hammerspoon-sample.txt" || true
      - name: Stop independent Hammerspoon RSS sampler
        if: always()
        run: kill "${HAMMERSPOON_SAMPLER_PID:-}" 2>/dev/null || true
      - name: Upload Hammerspoon memory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hammerspoon-memory-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hammerspoon-memory.json
            ${{ runner.temp }}/hammerspoon-rss.tsv
            ${{ runner.temp }}/hammerspoon-vmmap-summary.txt
            ${{ runner.temp }}/hammerspoon-sample.txt
          if-no-files-found: ignore
      - name: Hammerspoon logs
        if: failure()
        run: |
          log show --last 5m --style compact --predicate 'process == "Hammerspoon"' 2>/dev/null | tail -200 || true
          find "$HOME/Library/Logs" -maxdepth 3 -type f -iname '*hammerspoon*' -print -exec tail -200 {} \; 2>/dev/null || true
      - name: Stop Hammerspoon
        if: always()
        run: pkill -x Hammerspoon || true
